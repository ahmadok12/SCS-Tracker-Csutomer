<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaikh China Sourcing — Customer Order Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080808; --muted:#5d6470; --red:#e31b23; --red-dark:#b51219;
  --red-soft:#fff1f2; --line:#e5e7eb;
  --card:#ffffff; --panel:#fafafa; --ok:#1a9b5c; --ok-soft:#e6f7ee;
  --radius:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',ui-sans-serif,system-ui,sans-serif; background:#fff; color:var(--ink);
  min-height:100vh; line-height:1.5; letter-spacing:-.01em;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
  background-image:linear-gradient(90deg, #e31b2309 1px, transparent 1px), linear-gradient(#e31b2309 1px, transparent 1px);
  background-size:44px 44px;
}
h1,h2,h3,.display{font-family:'Inter',sans-serif; letter-spacing:-.05em; font-weight:900}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--red)}

/* ---------- shell ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px; border-bottom:1px solid var(--line);
  position:sticky; top:0; background:#ffffffc7; -webkit-backdrop-filter:blur(20px) saturate(145%); backdrop-filter:blur(20px) saturate(145%); z-index:50;
}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.brand-logo{width:43px; height:43px; object-fit:contain; flex:0 0 auto}
.brand-copy{display:flex; align-items:baseline; gap:10px; min-width:0}
.brand .display{font-size:22px; letter-spacing:-.04em; white-space:nowrap}
.brand .display .brand-red{color:var(--red); font-weight:900}
.brand small{color:var(--muted); font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700}
.nav{display:flex; gap:8px}
.nav button{
  background:transparent; border:1px solid var(--line); color:var(--muted);
  padding:9px 18px; border-radius:999px; font-size:13px; font-weight:700; transition:.18s;
}
.nav button:hover{color:var(--red); border-color:#e31b2355}
.nav button.active{background:var(--ink); border-color:var(--ink); color:#fff}
.nav button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid var(--red); outline-offset:2px;
}
@media(max-width:620px){
  .topbar{padding:11px 16px}
  .brand{gap:9px}
  .brand-logo{width:36px; height:36px}
  .brand-copy{display:block}
  .brand .display{font-size:clamp(15px,4.4vw,19px)}
  .brand small{display:block; margin-top:1px; font-size:8px; letter-spacing:.1em}
}
main{max-width:1080px; margin:0 auto; padding:36px 24px 80px; position:relative}
.view{display:none}
.view.on{display:block; animation:fade .35s ease}
@keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }

/* ---------- home ---------- */
.hero{text-align:center; padding:48px 0 20px}
.hero .eyebrow{
  color:var(--red-dark); letter-spacing:.02em; text-transform:none; font-size:12px; font-weight:750;
  background:var(--red-soft); border:1px solid #e31b2333; border-radius:999px; padding:7px 14px; display:inline-block;
}
.hero h1{font-size:clamp(40px,7vw,64px); line-height:.98; margin:18px 0 8px}
.hero h1 span{color:var(--red)}
.hero p{color:var(--muted); max-width:520px; margin:0 auto; font-weight:500}
.home-cards{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:36px}
@media(max-width:700px){.home-cards{grid-template-columns:1fr}}
.home-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:28px; text-align:left; transition:.2s; color:var(--ink); box-shadow:0 2px 10px #0a0a0a08;
}
.home-card:hover{border-color:var(--red); transform:translateY(-2px); box-shadow:0 16px 30px #e31b2314}
.home-card h2{font-size:24px; margin-bottom:6px; letter-spacing:-.03em}
.home-card p{color:var(--muted); font-size:14px; font-weight:500}
.home-card .tag{display:inline-block; margin-top:14px; font-size:12px; font-weight:750; letter-spacing:.04em; color:var(--red)}

/* ---------- track ---------- */
.track-box{max-width:560px; margin:0 auto}
.search-row{display:flex; gap:10px; margin-top:18px}
.search-row input{
  flex:1; background:#fff; border:1px solid var(--line); border-radius:999px;
  padding:14px 18px; color:var(--ink); font-size:16px; letter-spacing:.02em;
}
.search-row input::placeholder{color:#9aa0aa}
.btn{
  background:var(--ink); color:#fff; border:none; border-radius:999px;
  padding:14px 24px; font-weight:750; font-size:14px; transition:.18s;
}
.btn:hover{background:var(--red); transform:translateY(-1px)}
.btn.ghost{background:#fffc; border:1px solid var(--line); color:var(--ink)}
.btn.ghost:hover{border-color:var(--red); color:var(--red); background:#fff; transform:none}
.btn.gold{background:var(--red); color:#fff}
.btn.gold:hover{filter:brightness(.92); background:var(--red)}
.btn.sm{padding:9px 16px; font-size:12.5px; border-radius:999px}
.hint{color:var(--muted); font-size:13px; margin-top:10px; text-align:center}
.err{color:var(--red-dark); font-size:14px; margin-top:12px; text-align:center; display:none}

/* ---------- order card / route ---------- */
.order-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:28px; margin-top:28px; box-shadow:0 2px 10px #0a0a0a08;
}
.order-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap}
.order-head h2{font-size:26px; letter-spacing:-.03em}
.order-head .tn{color:var(--muted); font-size:13px; letter-spacing:.03em; font-weight:600; margin-top:4px}
.status-pill{
  padding:7px 15px; border-radius:999px; font-size:12.5px; font-weight:750;
  background:var(--red-soft); color:var(--red-dark); border:1px solid #e31b2333;
  white-space:nowrap;
}
.status-pill.done{background:var(--ok-soft); color:var(--ok); border-color:#1a9b5c33}

.route{margin:34px 0 8px; position:relative; padding:26px 6px 0}
.route-line{position:relative; height:4px; background:#eef0f2; border-radius:99px}
.route-fill{
  position:absolute; left:0; top:0; height:100%; border-radius:99px;
  background:linear-gradient(90deg, var(--ink), var(--red)); transition:width 1s ease;
}
.route-ship{
  position:absolute; top:-15px; transform:translateX(-50%); transition:left 1s ease;
  font-size:0; line-height:0;
}
.route-ship svg{width:34px; height:34px; display:block; filter:drop-shadow(0 3px 6px rgba(10,10,10,.25))}
.route-stops{display:flex; justify-content:space-between; margin-top:14px}
.stop{flex:1; text-align:center; position:relative}
.stop::before{
  content:""; width:10px; height:10px; border-radius:50%; background:#eef0f2;
  border:2px solid var(--line); display:block; margin:-25px auto 12px;
}
.stop.past::before{background:var(--ink); border-color:var(--ink)}
.stop.now::before{background:var(--red); border-color:var(--red); box-shadow:0 0 0 5px #e31b2326}
.stop span{font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:#9aa0aa; font-weight:700}
.stop.past span,.stop.now span{color:var(--ink)}
@media(max-width:640px){ .stop span{font-size:9px} }

.meta-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-top:26px}
.meta{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px}
.meta label{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:750; margin-bottom:4px}
.meta div{font-size:16px; font-weight:700}
.meta .big{font-size:28px; color:var(--red); letter-spacing:-.03em}

.updates{margin-top:26px}
.updates h3{font-size:17px; color:var(--ink); margin-bottom:12px; letter-spacing:-.02em}
.update{
  display:flex; gap:14px; padding:12px 0; border-bottom:1px dashed var(--line); font-size:14px; font-weight:500;
}
.update:last-child{border-bottom:none}
.update time{color:var(--muted); white-space:nowrap; font-size:13px; min-width:92px; font-weight:600}

/* ---------- admin ---------- */
.admin-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; margin-bottom:22px}
.admin-head h1{font-size:32px; letter-spacing:-.04em}
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:26px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 2px 10px #0a0a0a08}
.stat b{font-size:30px; display:block; color:var(--red); letter-spacing:-.03em}
.stat span{font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-weight:700}

.table-wrap{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow-x:auto; box-shadow:0 2px 10px #0a0a0a08}
table{width:100%; border-collapse:collapse; min-width:760px}
th{
  text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  padding:14px 16px; border-bottom:1px solid var(--line); font-weight:750;
}
td{padding:14px 16px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.row:hover td{background:#fff1f280}
.mini-bar{width:110px; height:8px; background:#eef0f2; border-radius:99px; overflow:hidden}
.mini-fill{height:100%; background:linear-gradient(90deg,var(--ink),var(--red)); border-radius:99px}
.pct{font-weight:750; color:var(--red-dark); font-size:13px; margin-left:8px}
td .stagechip{
  font-size:11.5px; font-weight:750; padding:5px 12px; border-radius:99px;
  background:var(--panel); border:1px solid var(--line); white-space:nowrap;
}
.copy-tn{background:none; border:none; color:var(--red); font-size:13px; font-weight:700; padding:0}
.copy-tn:hover{text-decoration:underline}
.empty{padding:40px; text-align:center; color:var(--muted)}

/* ---------- modal / form ---------- */
.modal-bg{
  position:fixed; inset:0; background:rgba(10,10,10,.55); backdrop-filter:blur(4px);
  display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 16px; overflow-y:auto;
}
.modal-bg.on{display:flex}
.modal{
  background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  width:100%; max-width:640px; padding:28px; animation:fade .25s ease; box-shadow:0 30px 70px #0a0a0a2e;
}
.modal h2{font-size:24px; margin-bottom:18px; letter-spacing:-.03em}
.fgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.fgrid .full{grid-column:1/-1}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.field label{display:block; font-size:11.5px; font-weight:750; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%; background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:11px 13px; color:var(--ink); font-size:15px;
}
.field textarea{resize:vertical; min-height:70px}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px}
.danger{color:var(--red-dark); background:none; border:none; font-size:14px; font-weight:700; margin-right:auto}
.danger:hover{text-decoration:underline}

/* login */
.login-box{max-width:380px; margin:60px auto; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:32px; text-align:center; box-shadow:0 2px 10px #0a0a0a08}
.login-box h2{font-size:26px; margin-bottom:6px; letter-spacing:-.03em}
.login-box p{color:var(--muted); font-size:14px; margin-bottom:18px; font-weight:500}
.login-box input{
  width:100%; background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:13px; color:var(--ink); font-size:16px; text-align:center; letter-spacing:.15em; margin-bottom:14px;
}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--ink); color:#fff; font-weight:700; padding:12px 22px; border-radius:99px;
  transition:.3s; z-index:200; font-size:14px; opacity:0;
}
.toast.on{transform:translateX(-50%) translateY(0); opacity:1}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="Logo%20(1).jpeg" alt="Shaikh China Sourcing logo">
    <div class="brand-copy">
      <div class="display">SHAIKH <span class="brand-red">CHINA</span> SOURCING</div>
      <small>Customer Order Tracker</small>
    </div>
  </div>
</header>

<main>
  <!-- TRACK / CUSTOMER PORTAL -->
  <section id="view-track" class="view on">
    <div id="cust-login" class="login-box">
      <h2>Customer login</h2>
      <p>Use the email &amp; password we sent you to view your orders.</p>
      <input id="cust-email" type="email" placeholder="you@company.com" style="letter-spacing:normal; text-align:left; font-size:15px">
      <input id="cust-pass" type="password" placeholder="Password" style="letter-spacing:normal; text-align:left; font-size:15px"
             onkeydown="if(event.key==='Enter')custLogin()">
      <button class="btn" style="width:100%" onclick="custLogin()">Sign in</button>
      <p class="err" id="cust-err" style="margin-top:12px">Wrong email or password. Message us if you need it resent.</p>
    </div>
    <div id="cust-dashboard" style="display:none">
      <div class="admin-head">
        <h1 id="cust-greeting">My orders</h1>
        <button class="btn ghost sm" onclick="custLogout()">Sign out</button>
      </div>
      <div id="cust-order-list"></div>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
/* ================= data layer ================= */
const STAGES = [
  {name:'Inquiry',        pct:5},
  {name:'Quote',          pct:15},
  {name:'Payment',        pct:25},
  {name:'Production',     pct:50},
  {name:'Received in China Warehouse', pct:60},
  {name:'Quality Check',  pct:70},
  {name:'Shipping',       pct:85},
  {name:'Customs',        pct:93},
  {name:'Delivered',      pct:100},
];
function stagesForCategory(category){
  if(category!=='Shipping') return STAGES;
  const excluded = new Set(['Production','Received in China Warehouse','Quality Check']);
  return STAGES.filter(stage=>!excluded.has(stage.name));
}
// ===== Supabase config — fill these in from Settings → API in your Supabase project =====
const SUPABASE_URL = 'https://eourkizstbgmrqkdwnjd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_rEKWzv2DaUZHhHwBdCJKXg_9jEQkz6k';
const NEEDS_SETUP = SUPABASE_URL.startsWith('YOUR_') || SUPABASE_ANON_KEY.startsWith('YOUR_');
const sb = NEEDS_SETUP ? null : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let orders = [];
let customers = [];       // admin: every customer. customer login: just their own row.
let editingId = null;
let unlocked = false;     // admin session
let custUnlocked = false; // customer session

// demo data shown only if Supabase isn't configured yet, so the prototype still works
const seed = () => {
  const c1 = crypto.randomUUID(), c2 = crypto.randomUUID(), c3 = crypto.randomUUID();
  customers = [
    {id:c1, name:'Bilal Traders', email:'demo@bilaltraders.com', city:'Karachi'},
    {id:c2, name:'Al Noor Electronics', email:'demo@alnoor.ae', city:'Dubai'},
    {id:c3, name:'Madina Mart', email:'demo@madinamart.pk', city:'Lahore'},
  ];
  orders = [
    {id:crypto.randomUUID(), customer_id:c1, tn:'SCS-2607-4821',
     product:'500 × LED desk lamps, custom logo', stage:'Production', pct:55,
     eta:'2026-08-20', updates:[
       {t:'2026-07-02', msg:'Inquiry received and supplier shortlist prepared.'},
       {t:'2026-07-08', msg:'Quote approved and 30% advance received.'},
       {t:'2026-07-18', msg:'Sample approved — mass production started at factory.'}]},
    {id:crypto.randomUUID(), customer_id:c2, tn:'SCS-2606-3390',
     product:'1,200 × Bluetooth speakers', stage:'Shipping', pct:85,
     eta:'2026-08-02', updates:[
       {t:'2026-06-25', msg:'QC passed — 0 critical defects in AQL inspection.'},
       {t:'2026-07-14', msg:'Container loaded at Guangzhou port, vessel departs 16 July.'}]},
    {id:crypto.randomUUID(), customer_id:c3, tn:'SCS-2605-1177',
     product:'300 × kitchen appliance sets', stage:'Delivered', pct:100,
     eta:'2026-07-05', updates:[
       {t:'2026-07-04', msg:'Cleared Karachi customs.'},
       {t:'2026-07-05', msg:'Delivered to warehouse. Order complete — thank you!'}]},
  ];
};

async function loadOrders(){
  if(NEEDS_SETUP) return; // seed() already filled orders
  const {data, error} = await sb.from('orders').select('*').order('created_at');
  if(error){ toast('Could not load orders: '+error.message); orders = []; return; }
  orders = data;
}
async function loadCustomers(){
  if(NEEDS_SETUP) return; // seed() already filled customers
  const {data, error} = await sb.from('customers').select('*').order('name');
  if(error){ toast('Could not load customers: '+error.message); customers = []; return; }
  customers = data;
}
function customerName(id){ return customers.find(c=>c.id===id)?.name || 'Unknown customer'; }

/* ================= customer login + dashboard ================= */
async function custLogin(){
  if(NEEDS_SETUP){ await enterCustDashboard(); return; }
  document.getElementById('cust-err').textContent = 'Wrong email or password. Message us if you need it resent.';
  const email = document.getElementById('cust-email').value.trim();
  const password = document.getElementById('cust-pass').value;
  const {error} = await sb.auth.signInWithPassword({email, password});
  if(error){ document.getElementById('cust-err').style.display='block'; return; }
  document.getElementById('cust-err').style.display='none';
  const validCustomer = await enterCustDashboard();
  if(!validCustomer){
    await sb.auth.signOut();
    document.getElementById('cust-err').textContent = 'Access denied — this account is not a customer login.';
    document.getElementById('cust-err').style.display='block';
  }
}
async function custLogout(){
  if(!NEEDS_SETUP) await sb.auth.signOut();
  custUnlocked = false;
  document.getElementById('cust-login').style.display='block';
  document.getElementById('cust-dashboard').style.display='none';
}
async function enterCustDashboard(){
  await loadCustomers(); // RLS returns just this customer's own row
  await loadOrders();    // RLS returns just this customer's own orders
  if(!NEEDS_SETUP && !customers.length) return false;
  custUnlocked = true;
  document.getElementById('cust-login').style.display='none';
  document.getElementById('cust-dashboard').style.display='block';
  renderCustDashboard();
  return true;
}
function renderCustDashboard(){
  const me = customers[0];
  document.getElementById('cust-greeting').textContent = me ? `Welcome, ${me.name}` : 'My orders';
  const list = document.getElementById('cust-order-list');
  if(!orders.length){ list.innerHTML = `<p class="hint" style="text-align:left">No orders yet — nothing to show here so far.</p>`; return; }
  const visibleOrders = orders.slice().sort((a,b)=>(a.pct===100)-(b.pct===100) || b.pct-a.pct);
  list.innerHTML = visibleOrders.map(o=>orderCard(o)).join('<div style="height:22px"></div>');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    list.querySelectorAll('.order-card').forEach((card,i)=>{
      const o = visibleOrders[i];
      const f = card.querySelector('.route-fill'), s = card.querySelector('.route-ship');
      if(f){ f.style.width = o.pct+'%'; s.style.left = o.pct+'%'; }
    });
  }));
}

function shipSVG(){
  return `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M3 15h18l-1.8 4.2c-.2.5-.7.8-1.2.8H6c-.5 0-1-.3-1.2-.8L3 15Z" fill="#e31b23"/>
    <path d="M6 15v-3h12v3" stroke="#e31b23" stroke-width="1.6"/>
    <path d="M9 12V8h6v4" stroke="#080808" stroke-width="1.6"/>
    <path d="M12 8V5" stroke="#080808" stroke-width="1.6"/>
  </svg>`;
}

function orderCard(o){
  const routeStages = stagesForCategory(o.category || 'Sourcing');
  const idx = routeStages.findIndex(s=>s.name===o.stage);
  const done = o.pct>=100;
  const stops = routeStages.map((s,i)=>`
    <div class="stop ${i<idx?'past':''} ${i===idx?'now':''}"><span>${s.name}</span></div>`).join('');
  const updates = (o.updates||[]).slice().reverse().map(u=>`
    <div class="update"><time>${fmtDate(u.t)}</time><div>${esc(u.msg)}</div></div>`).join('')
    || `<div class="update"><div style="color:var(--ink-dim)">No updates posted yet.</div></div>`;
  return `
  <div class="order-card">
    <div class="order-head">
      <div>
        <h2>${esc(o.product)}</h2>
        <div class="tn">${o.tn} &nbsp;·&nbsp; ${esc(customerName(o.customer_id))}</div>
      </div>
      <span class="status-pill ${done?'done':''}">${done?'✓ Delivered':'Current stage: '+o.stage}</span>
    </div>
    <div class="route">
      <div class="route-line">
        <div class="route-fill" style="width:0%"></div>
        <div class="route-ship" style="left:0%">${shipSVG()}</div>
      </div>
      <div class="route-stops">${stops}</div>
    </div>
    <div class="meta-grid">
      <div class="meta"><label>Progress</label><div class="big">${o.pct}%</div></div>
      <div class="meta"><label>Current stage</label><div>${o.stage}</div></div>
      <div class="meta"><label>Estimated ${done?'delivered':'completion'}</label><div>${fmtDate(o.eta)||'—'}</div></div>
    </div>
    <div class="updates">
      <h3>Updates from our team</h3>
      ${updates}
    </div>
  </div>`;
}

async function checkExistingSession(){
  if(NEEDS_SETUP) return;
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return;
  const validCustomer = await enterCustDashboard();
  if(!validCustomer) await sb.auth.signOut();
}

/* ================= utils ================= */
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('on'), 2600);
}

if(NEEDS_SETUP){
  seed();
  window.addEventListener('DOMContentLoaded', ()=>toast('Demo mode — sign in with any email/password to preview, or add your Supabase URL/key in the script to go live'));
} else {
  checkExistingSession();
}
</script>
